name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mon - Fri 03:00 UTC (05:00 CEST / 04:00 CET)
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
    inputs:
      api_ref:
        description: Git ref of the API repository (calculator_api_ts)
        default: main
        type: string
      ui_ref:
        description: Git ref of the UI repository (calculator_ui_ts)
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Runs on main share one group with manual-test-run.yml so that Pages deployments
# (which rebuild the report history) never overlap. Pull requests get their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ui-tests-pr-{0}', github.event.pull_request.number) || 'ui-tests-pages' }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test-reusable.yml
    with:
      api_ref: ${{ inputs.api_ref || 'main' }}
      ui_ref: ${{ inputs.ui_ref || 'main' }}
      enable_trace: false

  deploy:
    name: Publish report
    # Publish even when tests failed so the failure report is available on Pages
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [test]
    uses: ./.github/workflows/deploy-to-pages-reusable.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    with:
      artifact_name: report-${{ github.run_id }}-${{ github.run_attempt }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
